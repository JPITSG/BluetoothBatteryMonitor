<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Configuration UI checks</title>
<style>
  body { margin: 24px; background: #f4f4f5; color: #262626; font: 14px system-ui; }
  iframe { width: 420px; border: 1px solid #d4d4d4; background: white; border-radius: 6px; }
  li { margin-bottom: 6px; } .fail { color: #b91c1c; } .pass { color: #166534; }
</style>
<h1>Configuration UI checks</h1>
<p>Uses the built page with a simulated WebView host. Host replies are held until immediate UI feedback is verified.</p>
<iframe title="Configuration preview"></iframe>
<ol id="results"></ol>
<p id="outcome" role="status">Running…</p>
<script type="module">
const frame = document.querySelector('iframe');
const results = document.querySelector('#results');
let checks = 0;
const check = (condition, message) => {
  const item = document.createElement('li');
  item.className = condition ? 'pass' : 'fail';
  item.textContent = `${condition ? 'PASS' : 'FAIL'}: ${message}`;
  results.append(item);
  if (!condition) throw new Error(message);
  checks++;
};
const wait = async (predicate) => {
  const deadline = performance.now() + 5000;
  while (!predicate()) {
    if (performance.now() > deadline) throw new Error('Timed out waiting for UI');
    await new Promise(resolve => setTimeout(resolve, 10));
  }
};
function mockHost() {
  const listeners = new Set();
  const state = { type: 'update', status: '', busy: false, installing: false, canInstall: false, automatic: false, currentVersion: '1.0.16' };
  const devices = [
    { name: 'Headphones', isConfigured: true },
    { name: 'Keyboard', isConfigured: false },
    { name: 'Mouse', isConfigured: true },
    { name: 'Earbuds', isConfigured: false },
  ];
  const deviceStatuses = [
    { name: 'Headphones', online: false, batteryLevel: null },
    { name: 'Mouse', online: true, batteryLevel: 67 },
  ];
  const messages = [];
  const send = data => listeners.forEach(listener => listener({ data }));
  window.testHost = { send, state, devices, deviceStatuses, messages };
  window.chrome ??= {};
  window.chrome.webview = {
    addEventListener: (_, listener) => listeners.add(listener),
    removeEventListener: (_, listener) => listeners.delete(listener),
    postMessage: raw => {
      const message = JSON.parse(raw);
      messages.push(message);
      if (message.action === 'getInit') setTimeout(() => send({ type: 'init', devices, deviceStatuses, version: '1.0.16', autoCheck: false, startWithWindows: false, loadingDevices: true }), 0);
      if (message.action === 'getDeviceStatus') setTimeout(() => send({ type: 'deviceStatus', deviceStatuses }), 0);
      if (message.action === 'getUpdateState') setTimeout(() => send(state), 0);
      if (message.action === 'resize') parent.postMessage({ testHeight: message.height }, '*');
      // All action acknowledgements are deliberately controlled by the test.
    },
  };
}
window.addEventListener('message', event => {
  if (event.source === frame.contentWindow && event.data.testHeight) frame.style.height = `${Math.min(560, event.data.testHeight)}px`;
});
try {
  const html = await (await fetch('../assets/dist/index.html')).text();
  frame.srcdoc = html.replace('<head>', `<head><script>(${mockHost.toString()})();<\/script>`);
  await wait(() => frame.contentDocument.querySelector('button'));
  const doc = frame.contentDocument;
  const host = frame.contentWindow.testHost;
  const button = text => [...doc.querySelectorAll('button')].find(button => button.textContent === text);
  const row = name => doc.querySelector(`section [data-device="${name}"]`);
  const checkbox = name => row(name)?.querySelector('input');
  const deviceOrder = () => [...doc.querySelectorAll('section [data-device]')].map(item => item.dataset.device).join('|');
  const paint = () => new Promise(resolve => frame.contentWindow.requestAnimationFrame(() => frame.contentWindow.requestAnimationFrame(resolve)));
  await paint();
  check(!!button('Update') && doc.body.textContent.includes('Refreshing devices'), 'Footer and saved devices are usable before discovery finishes.');
  check(doc.querySelector('section h2').textContent === 'Monitored', 'The device card is titled Monitored.');
  const startup = doc.querySelector('#startWithWindows');
  const startupCaption = [...doc.querySelectorAll('p')].find(p => p.textContent === 'Launches in the tray when you sign in to Windows.');
  check(startup && doc.querySelector('label[for="startWithWindows"]').textContent === 'Start with Windows' &&
    startupCaption?.parentElement.parentElement.contains(startup), 'Start with Windows is worded as in APIMonitor.');
  check((startup.compareDocumentPosition(doc.querySelector('#autoCheckForUpdates')) & 4) !== 0 &&
    (doc.querySelector('section').compareDocumentPosition(startup) & 4) !== 0,
    'Start with Windows sits between the device list and the automatic update option.');
  check(!startup.checked, 'The checkbox starts from the state Windows reports.');
  startup.click();
  await paint();
  check(startup.checked && host.messages.findLast(message => message.action === 'startWithWindows')?.enabled === true &&
    !host.messages.some(message => message.action === 'saveDevices'), 'Turning it on applies at once, without saving the device selection.');
  host.send({ type: 'startWithWindows', enabled: false });
  await wait(() => !startup.checked);
  check(!startup.checked, 'If Windows startup could not be changed, the checkbox shows the real state.');
  check(deviceOrder() === 'Mouse|Headphones|Earbuds|Keyboard', 'Saved checked devices appear first when configuration opens, connected ones leading, then alphabetical.');
  checkbox('Keyboard').focus();
  checkbox('Keyboard').click();
  await wait(() => deviceOrder() === 'Mouse|Headphones|Keyboard|Earbuds');
  check(checkbox('Keyboard').checked && doc.activeElement === checkbox('Keyboard'), 'Checking a device moves it into the top group and keeps keyboard focus.');
  checkbox('Keyboard').click();
  await wait(() => deviceOrder() === 'Mouse|Headphones|Earbuds|Keyboard');
  check(!checkbox('Keyboard').checked, 'Unchecking a device moves it below the checked devices.');
  row('Keyboard').querySelector('span').click();
  row('Mouse').querySelector('span span').click();
  row('Mouse').click();
  await paint();
  check(!checkbox('Keyboard').checked && checkbox('Mouse').checked && !doc.querySelector('section label') &&
    checkbox('Mouse').getAttribute('aria-label') === 'Mouse', 'Only the checkbox toggles monitoring; the name and status are not click targets, and the checkbox is still named.');
  const statusOf = name => row(name)?.querySelector('span span')?.textContent.replace(/^ · /, '') ?? '';
  check(!doc.querySelector('dl') && row('Mouse').textContent.startsWith('Mouse · Connected · 67%'), 'Device status appears inline inside the checkbox card, without a duplicate device list.');
  check(statusOf('Mouse') === 'Connected · 67%' && statusOf('Headphones') === 'Disconnected', 'Initial monitored-device status shows percentages only when connected.');
  check(frame.contentWindow.getComputedStyle(row('Headphones').querySelector('span span')).color === 'rgb(220, 38, 38)', 'Disconnected status is red.');
  const nameLine = name => row(name).querySelector('span').getBoundingClientRect();
  check(['Mouse', 'Headphones', 'Keyboard'].every(name => checkbox(name).getBoundingClientRect().height === 16 && nameLine(name).height >= 16 &&
    checkbox(name).getBoundingClientRect().top - nameLine(name).top === 1),
    'Each checkbox is centred on the name line: 16px inside its 16px line box, lowered 1px for Segoe UI glyphs, regardless of extra lines.');
  check(!doc.querySelector('time') && ['Mouse', 'Headphones'].every(name => row(name).textContent.includes('Last charged · Collecting data')),
    'Monitored devices without charge evidence show Collecting data while connected or disconnected.');
  check(!row('Keyboard').textContent.includes('Collecting data'), 'Unmonitored devices do not claim to be collecting battery history.');
  const mouseCharge = new Date().toISOString();
  const headphoneCharge = '2025-12-20T08:30:00Z';
  host.send({ type: 'deviceStatus', deviceStatuses: host.deviceStatuses.map(status => ({ ...status,
    lastChargedAt: status.name === 'Mouse' ? mouseCharge : headphoneCharge })) });
  await wait(() => row('Mouse').querySelector('time'));
  check(row('Mouse').querySelector('time').dateTime === mouseCharge && statusOf('Mouse') === 'Connected · 67%', 'A detected charge appears beneath the existing device status without duplicating its name or battery.');
  check(row('Headphones').querySelector('time').dateTime === headphoneCharge && statusOf('Headphones') === 'Disconnected', 'Last charge stays visible when a monitored device is disconnected.');
  check(row('Headphones').querySelector('time').textContent.includes('2025'), 'Older charge dates include the year.');
  check(row('Mouse').querySelector('time').parentElement.title.includes('5 percentage points') && checkbox('Mouse').checked, 'The charge tooltip explains detection and live updates preserve selection.');
  const localDate = new Date(mouseCharge);
  const localText = new frame.contentWindow.Intl.DateTimeFormat(undefined, { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }).format(localDate);
  check(row('Mouse').querySelector('time').textContent === localText, 'Charge timestamps are formatted in the user’s local time.');
  host.send({ type: 'deviceStatus', deviceStatuses: host.deviceStatuses.map(status => ({ ...status, lastChargedAt: 'invalid' })) });
  await wait(() => !doc.querySelector('time'));
  check(!doc.body.textContent.includes('Invalid Date') && row('Mouse').textContent.includes('Last charged · Collecting data'), 'Malformed charge timestamps safely use the collecting-data notice.');
  host.send({ type: 'deviceStatus', deviceStatuses: [{ name: 'Headphones', online: true, batteryLevel: null }, { name: 'Mouse', online: false, batteryLevel: null }] });
  await wait(() => statusOf('Mouse') === 'Disconnected');
  check(statusOf('Headphones') === 'Connected · Battery unknown', 'An unknown battery is never fabricated as 0%.');
  check(checkbox('Mouse').checked, 'Live status changes preserve monitoring selections.');
  check(deviceOrder() === 'Headphones|Mouse|Earbuds|Keyboard', 'Live status changes re-rank connected devices first within the checked group.');
  host.send({ type: 'deviceStatus', deviceStatuses: [{ name: 'Headphones', online: true, batteryLevel: 92 }, { name: 'Mouse', online: true, batteryLevel: 66 }] });
  await wait(() => statusOf('Mouse') === 'Connected · 66%');
  check(statusOf('Headphones') === 'Connected · 92%', 'Connection and battery changes appear live without reopening configuration.');
  // Battery trend graphs beside each monitored device.
  check(!doc.querySelector('section svg'), 'Monitored devices without battery history show no graph.');
  const DAY = 864e5, HOUR = 36e5;
  const now = Date.now();
  const reading = (time, percentage) => ({ observedAt: Number.isFinite(time) ? new Date(time).toISOString() : time, percentage });
  const chargeStart = Date.parse('2026-09-10T02:00:00Z');
  host.send({ type: 'deviceStatus', deviceStatuses: [
    { name: 'Headphones', online: false, batteryLevel: null, trend: [reading(chargeStart, 50), reading(chargeStart + 30 * 60e3, 60), reading(chargeStart + 90 * 60e3, 75)] },
    { name: 'Mouse', online: true, batteryLevel: 67, trend: [reading(now - 5 * DAY, 100), reading(now - 4 * DAY, 90), reading(now - 3 * DAY, 0),
      reading(now - 2 * DAY, 80), reading('invalid', 50), reading(now - DAY, 67)] },
  ] });
  await wait(() => doc.querySelectorAll('section svg').length === 2);
  const graph = name => row(name).querySelector('svg');
  const graphLabels = name => [...row(name).querySelectorAll('svg + div span')].map(span => span.textContent).join('|');
  const format = (options, times) => times.map(time => new frame.contentWindow.Intl.DateTimeFormat(undefined, options).format(time)).join('|');
  const dayLabels = times => format({ month: 'short', day: 'numeric' }, times);
  const clockLabels = times => format({ hour: 'numeric', minute: '2-digit' }, times);
  const hourLabels = times => format({ hour: 'numeric' }, times);
  check(!graph('Keyboard') && graph('Mouse').getBoundingClientRect().left >= nameLine('Mouse').right &&
    Math.abs(graph('Mouse').getBoundingClientRect().top - row('Mouse').getBoundingClientRect().top) < 1,
    'Graphs sit to the right of monitored device text, level with the device name.');
  check(graphLabels('Mouse') === dayLabels([now - 5 * DAY, now - 2.5 * DAY, now]), 'A multi-day discharge carries three dates from the peak to the present.');
  check(graph('Mouse').querySelectorAll('path')[1].getAttribute('d') === 'M0.0 3.5 L27.2 5.6 L81.6 7.7 L108.8 10.4 L136.0 10.4',
    'A connected level continues to the present on a fixed 0–100% scale; zero and malformed readings are skipped.');
  check(graph('Mouse').querySelectorAll('path')[0].getAttribute('d').endsWith('L136.0 10.4 L136.0 24.5 L0 24.5 Z') &&
    [...graph('Mouse').querySelectorAll('circle')].every(circle => circle.getAttribute('cx') === '136' && Number(circle.getAttribute('cy')).toFixed(1) === '10.4'),
    'The area fill closes on the 0% baseline and the end marker sits on the current level.');
  const description = name => graph(name).getAttribute('aria-label');
  check(description('Mouse').startsWith('Discharging 100% → 67% since ') && description('Mouse').endsWith(' · about 6.6% per day') &&
    graph('Mouse').parentElement.title === description('Mouse'), 'The discharge rate is described for tooltips and assistive technology.');
  check(graphLabels('Headphones') === clockLabels([chargeStart, chargeStart + 45 * 60e3, chargeStart + 90 * 60e3]),
    'A disconnected device ends at its last reading, with clock labels for a charge shorter than three hours.');
  check(description('Headphones').startsWith('Charging 50% → 75% since ') && description('Headphones').endsWith(' · about 17% per hour'),
    'Charging is described with its hourly rate.');
  check(row('Headphones').textContent.startsWith('Headphones · Disconnected') && row('Headphones').querySelectorAll('svg + div span').length === 3,
    'Graph labels do not disturb the device status text.');
  graph('Mouse').dispatchEvent(new frame.contentWindow.MouseEvent('click', { bubbles: true }));
  graph('Mouse').parentElement.click();
  await paint();
  check(checkbox('Mouse').checked, 'Clicking a graph does not toggle monitoring.');
  host.send({ type: 'deviceStatus', deviceStatuses: [
    { name: 'Headphones', online: false, batteryLevel: null, trend: [reading(chargeStart, 80), reading(chargeStart + 8 * HOUR, 60)] },
    { name: 'Mouse', online: true, batteryLevel: 67, trend: [reading(now - 2 * HOUR, 67)] },
  ] });
  await wait(() => description('Mouse')?.startsWith('Steady at 67% since '));
  check(graphLabels('Headphones') === hourLabels([chargeStart, chargeStart + 4 * HOUR, chargeStart + 8 * HOUR]), 'Spans under a day use hour labels.');
  const steadyLabels = base => clockLabels([base - 2 * HOUR, base - HOUR, base]);
  check([steadyLabels(now), steadyLabels(now + 60e3)].includes(graphLabels('Mouse')), 'A lone reading of a connected device extends level to the present.');
  host.send({ type: 'deviceStatus', deviceStatuses: [
    { name: 'Headphones', online: false, batteryLevel: null, trend: [reading(now - 2 * HOUR, 40)] },
    { name: 'Mouse', online: true, batteryLevel: null, trend: [reading(now - 2 * HOUR, 67)] },
  ] });
  await wait(() => !doc.querySelector('section svg'));
  check(!graph('Headphones') && !graph('Mouse'), 'A lone reading is not drawn while disconnected or while the current level is unknown.');

  // Offline periods: light red behind the battery line.
  const since = time => new frame.contentWindow.Intl.DateTimeFormat(undefined, { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }).format(time);
  const period = (from, to, reason = 'disconnected') => ({ from: new Date(from).toISOString(), to: to === null ? null : new Date(to).toISOString(), reason });
  const shades = name => [...graph(name).querySelectorAll('linearGradient stop')].map(stop => Number(stop.getAttribute('stop-opacity')));
  const gapTitles = name => [...graph(name).querySelectorAll('rect[data-gap] title')].map(title => title.textContent);
  const offlineLine = name => description(name).split('\n')[1];
  host.send({ type: 'deviceStatus', deviceStatuses: [
    { name: 'Mouse', online: true, batteryLevel: 67, trend: [reading(now - 4 * HOUR, 80), reading(now - HOUR, 67)],
      offline: [period(now - 3 * HOUR, now - 2 * HOUR)], connectionHistoryStart: new Date(now - 10 * HOUR).toISOString() },
    { name: 'Headphones', online: false, batteryLevel: null, trend: [reading(now - 10 * HOUR, 90), reading(now - 6 * HOUR, 70)],
      offline: [period(now - 9 * HOUR, now - 8.5 * HOUR, 'unmonitored'), period(now - 5 * HOUR, null)],
      connectionHistoryStart: new Date(now - 12 * HOUR).toISOString() },
  ] });
  await wait(() => graph('Mouse')?.querySelector('rect[data-offline]') && graph('Headphones')?.querySelector('rect[data-offline]'));
  const band = graph('Mouse').querySelector('rect[data-offline]');
  const gradientId = band.getAttribute('fill').match(/^url\(#(.+)\)$/)?.[1];
  check(gradientId && graph('Mouse').querySelector('linearGradient').id === gradientId && shades('Mouse').length === 136 &&
    band.getAttribute('y') === '4' && band.getAttribute('height') === '20' && band.getAttribute('width') === '136',
    'Offline time is one shaded band between the 0% and 100% hairlines, with a shade for each pixel column.');
  check(gradientId !== graph('Headphones').querySelector('linearGradient').id, 'Each graph uses its own shading.');
  check(shades('Mouse')[50] === 1 && shades('Mouse')[10] === 0 && shades('Mouse')[100] === 0 &&
    shades('Mouse').slice(35, 67).every(shade => shade === 1), 'A disconnection is solid red for exactly its time on the axis.');
  const mouseParts = [...graph('Mouse').children].map(node => node.tagName.toLowerCase());
  check(mouseParts.indexOf('rect') > mouseParts.indexOf('path') && mouseParts.lastIndexOf('path') > mouseParts.indexOf('rect'),
    'Offline shading covers the battery area but stays under the line.');
  check(graph('Mouse').querySelector('linearGradient stop').getAttribute('stop-color') === '#fecaca', 'Offline time is light red.');
  check(gapTitles('Mouse').length === 1 && gapTitles('Mouse')[0].startsWith('Disconnected · ') && gapTitles('Mouse')[0].endsWith(' · 1 h'),
    'Hovering a disconnection shows when it happened and for how long.');
  check(offlineLine('Mouse') === 'Offline once, 1 h in total' && graph('Mouse').parentElement.title === description('Mouse'),
    'The graph tooltip adds how often and how long the device was offline.');
  check([...graph('Mouse').querySelectorAll('circle')].every(circle => circle.getAttribute('cx') === '136' && !circle.getAttribute('stroke')),
    'A connected device still ends with a solid dot on its current level at the present.');
  const headphonePath = graph('Headphones').querySelectorAll('path');
  check(graphLabels('Headphones') === hourLabels([now - 10 * HOUR, now - 5 * HOUR, now]) &&
    headphonePath[1].getAttribute('d') === 'M0.0 5.6 L54.4 9.8' && headphonePath[0].getAttribute('d').endsWith('L54.4 24.5 L0 24.5 Z'),
    'A current disconnection extends the axis to the present while the line stops at the last reading.');
  const ring = [...graph('Headphones').querySelectorAll('circle')].find(circle => circle.getAttribute('stroke'));
  check(ring && Number(ring.getAttribute('cx')).toFixed(1) === '54.4' && ring.getAttribute('fill') === '#fff',
    'The last known level before going offline is a ring, not a live dot.');
  check(shades('Headphones').slice(69).every(shade => shade === 1) && shades('Headphones')[60] === 0 && shades('Headphones')[18] === 1,
    'The current disconnection is shaded to the present, separately from earlier offline time.');
  check(offlineLine('Headphones') === `Disconnected since ${since(now - 5 * HOUR)} · offline 2 times, 5 h 30 min in total`,
    'The tooltip says since when the device has been disconnected.');
  check(gapTitles('Headphones').length === 2 && gapTitles('Headphones')[0].startsWith('Not monitored (PC asleep or off, or app closed) · ') &&
    gapTitles('Headphones')[1] === `Disconnected since ${since(now - 5 * HOUR)} · 5 h`,
    'Time when nothing was monitored is explained separately from a disconnection.');

  // Many short drop-outs: an even tint, not a comb of slivers.
  const dropouts = Array.from({ length: 300 }, (_, index) => period(now - 70 * HOUR + index * 14 * 60e3, now - 70 * HOUR + index * 14 * 60e3 + 3 * 60e3));
  host.send({ type: 'deviceStatus', deviceStatuses: [
    { name: 'Mouse', online: true, batteryLevel: 83, trend: [reading(now - 72 * HOUR, 95), reading(now - HOUR, 83)],
      offline: dropouts, connectionHistoryStart: new Date(now - 96 * HOUR).toISOString() },
  ] });
  await wait(() => offlineLine('Mouse')?.startsWith('Offline 300 times'));
  const dense = shades('Mouse').slice(8, 128);
  const steps = dense.slice(1).map((shade, index) => Math.abs(shade - dense[index]));
  check(dense.every(shade => shade > 0.25 && shade < 0.6) && Math.max(...steps) < 0.1,
    'Frequent short drop-outs blend into an even, lighter tint without stripes.');
  check(gapTitles('Mouse').length === 0 && offlineLine('Mouse') === 'Offline 300 times, 15 h in total',
    'Drop-outs too narrow to point at are summarised in the tooltip instead.');

  host.send({ type: 'deviceStatus', deviceStatuses: [
    { name: 'Mouse', online: true, batteryLevel: 70, trend: [reading(now - 10 * HOUR, 80), reading(now - HOUR, 70)],
      offline: [], connectionHistoryStart: new Date(now - 2 * HOUR).toISOString() },
  ] });
  await wait(() => offlineLine('Mouse')?.startsWith('No disconnections'));
  check(offlineLine('Mouse') === `No disconnections since ${since(now - 2 * HOUR)}` && !graph('Mouse').querySelector('rect[data-offline]'),
    'Before recording began nothing is known, so the tooltip says since when connections are covered.');
  host.send({ type: 'deviceStatus', deviceStatuses: [] });
  await wait(() => statusOf('Mouse') === '');
  check(row('Mouse').textContent === 'Mouse', 'An unmonitored device is not assigned a fabricated connection state.');
  host.send({ type: 'deviceStatus', deviceStatuses: host.deviceStatuses });
  await wait(() => statusOf('Mouse') === 'Connected · 67%');
  await paint();
  checkbox('Mouse').click();
  checkbox('Keyboard').click();
  const started = performance.now();
  button('Update').click();
  await wait(() => button('Checking...'));
  await paint();
  const latency = performance.now() - started;
  check(latency < 1000, `Update paints immediate feedback before any host reply (${Math.round(latency)} ms in this browser).`);
  await wait(() => frame.contentWindow.getComputedStyle(button('Checking...')).backgroundColor === 'rgb(220, 38, 38)');
  check(frame.contentWindow.getComputedStyle(button('Checking...')).backgroundColor === 'rgb(220, 38, 38)', 'Checking uses the red stop button.');
  check(button('Checking...').textContent === 'Checking...', 'Before transfer begins the button retains Checking....');
  host.send({ ...host.state, busy: true, status: 'Downloading… 0% (0 KB/s)', downloadPercent: 0 });
  await wait(() => button('Checking (0%)...'));
  check(!!button('Checking (0%)...'), 'A transfer that has just started shows 0% complete.');
  host.send({ ...host.state, busy: true, status: 'Downloading… 42% (1234 KB/s)', downloadPercent: 42 });
  await wait(() => button('Checking (42%)...'));
  const downloading = button('Checking (42%)...');
  check(!downloading.disabled && frame.contentWindow.getComputedStyle(downloading).backgroundColor === 'rgb(220, 38, 38)',
    'Download progress shows the completed percentage on the red cancellable button.');
  check(!downloading.textContent.includes('/s'), 'The button shows the percentage instead of the transfer rate.');
  check(downloading.title.startsWith('Downloading… 42%') && downloading.title.endsWith('Click to stop update check and download'),
    'Hovering the busy button explains that clicking it stops the download.');
  await paint();
  let rowMutations = 0;
  const observer = new MutationObserver(records => rowMutations += records.length);
  observer.observe(doc.querySelector('section'), { childList: true, subtree: true, attributes: true, characterData: true });
  const resizeCount = host.messages.filter(message => message.action === 'resize').length;
  for (let i = 0; i < 200; i++) host.send({ ...host.state, busy: true, status: `Downloading… ${i >> 1}%`, downloadPercent: i >> 1 });
  await paint();
  observer.disconnect();
  check(rowMutations === 0, 'Download progress leaves the device rows untouched.');
  check(host.messages.filter(message => message.action === 'resize').length === resizeCount, 'Download progress does not trigger native resize traffic.');
  button('Checking (99%)...').click();
  await wait(() => button('Stopping...'));
  check(button('Stopping...').disabled, 'Cancel responds immediately and prevents duplicate requests.');
  host.send({ ...host.state, status: 'Update check cancelled or timed out.' });
  await wait(() => button('Update'));
  check(!doc.querySelector('dialog').open, 'A cancelled check returns to idle without an alert.');
  host.send({ type: 'devices', devices: [host.devices[0], host.devices[2], { name: 'Gamepad', isConfigured: false }], loadingDevices: false });
  await wait(() => checkbox('Gamepad'));
  check(!checkbox('Mouse').checked && checkbox('Keyboard').checked, 'Late discovery preserves edits and selected devices missing from the refreshed list.');
  check(deviceOrder() === 'Headphones|Keyboard|Gamepad|Mouse', 'Late discovery keeps selected devices above new unchecked devices.');
  button('Save').click();
  const saved = host.messages.findLast(message => message.action === 'saveDevices').devices;
  check(saved.includes('Keyboard') && saved.includes('Headphones') && !saved.includes('Mouse'), 'Save sends the edited selection after discovery.');
  host.send({ ...host.state, status: "You're up to date.", canInstall: true, remoteVersion: '1.0.16' });
  await wait(() => doc.querySelector('dialog').open);
  const reopen = () => doc.querySelector('dialog input[type=checkbox]');
  check(reopen() && !reopen().checked && reopen().parentElement.textContent === 'Reopen settings after update', 'Update confirmations offer the exact unchecked-by-default checkbox.');
  reopen().click();
  await paint();
  doc.querySelector('dialog').querySelectorAll('button')[0].click();
  await wait(() => !doc.querySelector('dialog').open);
  host.send({ ...host.state, status: "You're up to date.", canInstall: true, remoteVersion: '1.0.16' });
  await wait(() => doc.querySelector('dialog').open);
  check(!reopen().checked, 'Cancelling a confirmation discards its reopen choice.');
  button('Force update').click();
  await wait(() => button('Starting...'));
  check(!doc.querySelector('dialog').open && button('Starting...').disabled, 'Installation responds immediately before the helper acknowledgement.');
  check(host.messages.findLast(message => message.action === 'installUpdate').reopenSettings === false, 'An unchecked force update sends false to the native host.');
  host.send({ ...host.state, status: 'Update failed: simulated helper failure.', canInstall: true, remoteVersion: '1.0.16' });
  await wait(() => doc.querySelector('dialog').open);
  check(doc.querySelector('#update-alert-title').textContent === 'Update failed', 'Helper failures restore an actionable error dialog.');
  check(!reopen().checked, 'A helper failure presents a fresh unchecked choice.');
  reopen().click();
  await paint();
  button('Force update').click();
  await wait(() => button('Starting...'));
  check(host.messages.findLast(message => message.action === 'installUpdate').reopenSettings === true, 'A checked force update sends true to the native host.');
  host.send({ ...host.state, status: 'Update failed: simulated helper failure.' });
  await wait(() => doc.querySelector('dialog').open);
  check(!reopen(), 'A non-installable error does not offer the reopen checkbox.');
  button('OK').click();
  await wait(() => !doc.querySelector('dialog').open);
  host.send({ ...host.state, status: 'A newer version is ready.', canInstall: true, remoteVersion: '1.0.99', automatic: true });
  await wait(() => doc.querySelector('dialog').open);
  check(!reopen().checked, 'A new upgrade confirmation starts unchecked after a previous checked attempt.');
  reopen().click();
  await paint();
  [...doc.querySelectorAll('dialog button')].find(item => item.textContent === 'Update').click();
  await wait(() => button('Starting...'));
  check(host.messages.findLast(message => message.action === 'installUpdate').reopenSettings === true, 'A checked newer-version update sends its one-time choice.');
  host.send({ ...host.state, status: 'Successfully updated to v1.0.99.' });
  await wait(() => doc.querySelector('dialog').open);
  check(!reopen(), 'Success notices do not retain an install choice.');
  button('OK').click();
  await wait(() => !doc.querySelector('dialog').open);
  check(!!button('Update'), 'Dismissal closes immediately before the host reply.');
  host.send({ ...host.state });
  host.send({ type: 'devices', devices: Array.from({ length: 35 }, (_, i) => ({ name: `Device ${i}`, isConfigured: false })), loadingDevices: false });
  await wait(() => checkbox('Device 34'));
  await paint();
  check(doc.documentElement.scrollHeight > frame.clientHeight, 'Long lists scroll only when content exceeds the available height.');
  host.send({ type: 'devices', devices: host.devices, loadingDevices: false });
  await wait(() => checkbox('Mouse'));
  await paint();
  await paint();
  check(doc.documentElement.scrollHeight <= frame.clientHeight && doc.documentElement.scrollWidth <= frame.clientWidth, 'A normal device list fits without vertical or horizontal scrollbars.');
  check(frame.contentWindow.getComputedStyle(doc.querySelector('#root > div > div')).padding === '16px', 'Outer padding matches SystrayLauncher (16px).');
  // Leave the preview showing the saved monitoring selection after testing edits.
  if (checkbox('Keyboard').checked) checkbox('Keyboard').click();
  if (!checkbox('Mouse').checked) checkbox('Mouse').click();
  document.querySelector('#outcome').textContent = `Passed ${checks} browser checks.`;
} catch (error) {
  document.querySelector('#outcome').textContent = `FAILED: ${error.message}`;
  document.querySelector('#outcome').className = 'fail';
}
</script>
</html>
